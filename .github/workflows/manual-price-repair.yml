name: manual-price-repair

on:
  workflow_dispatch:
    inputs:
      require_price_scope:
        description: "Fail if any in-scope ticker remains pending"
        required: false
        default: false
        type: boolean
      annotate_existing:
        description: "Only add missing price reasons; do not call price providers"
        required: false
        default: false
        type: boolean
      backfill_52w:
        description: "Backfill rolling 52-week history for current monthly consensus tickers"
        required: false
        default: false
        type: boolean

concurrency:
  group: trihourly-pipeline-main
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update prices
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          if [ "${{ inputs.annotate_existing }}" = "true" ]; then
            python scripts/prices.py --annotate-existing
          elif [ "${{ inputs.backfill_52w }}" = "true" ]; then
            python scripts/prices.py --history-weeks 52 --history-scope recent-28d
          else
            python scripts/prices.py
          fi
      - name: Verify price result
        run: |
          if [ "${{ inputs.backfill_52w }}" = "true" ]; then
            if [ "${{ inputs.require_price_scope }}" = "true" ]; then
              python scripts/verify_data.py --require-price-scope --require-price-history-52w
            else
              python scripts/verify_data.py --require-price-history-52w
            fi
          elif [ "${{ inputs.require_price_scope }}" = "true" ]; then
            python scripts/verify_data.py --require-price-scope
          else
            python scripts/verify_data.py
          fi
      - name: Summarize 52-week coverage
        if: ${{ inputs.backfill_52w }}
        run: |
          python - <<'PY'
          import json, os
          manifest = json.load(open("data/db/manifest.json", encoding="utf-8"))
          coverage = manifest.get("price_history_52w", {})
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## 52-week price backfill\n")
              summary.write(f"- report cutoff (ET): {coverage.get('asof')}\n")
              summary.write(f"- target start: {coverage.get('target_start')}\n")
              summary.write(f"- monthly consensus tickers: {coverage.get('tickers')}\n")
              summary.write(f"- statuses: `{json.dumps(coverage.get('status_counts', {}), sort_keys=True)}`\n")
          PY
      - name: Commit manual price repair
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "- price data: unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Manual price repair $(date -u +%Y-%m-%dT%H:%M)"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::Remote changed incompatibly while publishing; no repair was pushed."
            exit 1
          fi
          git push origin HEAD:main
          echo "## Manual price repair" >> "$GITHUB_STEP_SUMMARY"
          echo "- published commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
