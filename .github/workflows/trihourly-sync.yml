name: trihourly-sync

on:
  # Cloudflare Cron is the sole automatic trigger. Keeping GitHub's own
  # `schedule` here would create two production writers for the same slot.
  repository_dispatch:
    types: [cloudflare_trihourly_sync]
  workflow_dispatch:
    inputs:
      extraction_provider:
        description: "auto, anthropic, or openai"
        required: false
        default: "auto"
        type: choice
        options: [auto, anthropic, openai]
      extraction_model:
        description: "Optional provider-specific model override"
        required: false
        default: ""
        type: string

concurrency:
  group: trihourly-pipeline-main
  cancel-in-progress: false

jobs:
  resolve-base:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      account_matrix: ${{ steps.roster.outputs.matrix }}
      account_count: ${{ steps.roster.outputs.count }}
    steps:
      # A queued workflow keeps the SHA from when it was dispatched. Resolve
      # main only after this run owns the shared concurrency slot instead.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Record current main revision
        id: base
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "## Trihourly source" >> "$GITHUB_STEP_SUMMARY"
          echo "- locked main revision: $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate active account roster
        id: roster
        run: |
          echo "matrix=$(python scripts/roster.py --matrix)" >> "$GITHUB_OUTPUT"
          echo "count=$(python scripts/roster.py --count)" >> "$GITHUB_OUTPUT"
      - name: Record sync start
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/write_sync_health.py start --source-sha "${{ steps.base.outputs.sha }}"

  fetch-extract:
    needs: resolve-base
    name: fetch-extract (${{ matrix.blogger_id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # twitterapi.io free-tier traffic is shared. Keep active accounts
      # serial so a new run is reliable instead of concurrently rate-limited.
      max-parallel: 1
      matrix: ${{ fromJson(needs.resolve-base.outputs.account_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-base.outputs.base_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record trigger provenance
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          CF_SLOT_UTC: ${{ github.event.client_payload.slot_utc || 'manual' }}
          CF_DISPATCHED_AT: ${{ github.event.client_payload.dispatched_at_utc || 'manual' }}
        run: |
          {
            echo "## Trihourly trigger"
            echo "- event: $TRIGGER_EVENT"
            echo "- Cloudflare slot UTC: $CF_SLOT_UTC"
            echo "- Cloudflare dispatched at UTC: $CF_DISPATCHED_AT"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch incremental posts
        id: fetch
        shell: bash
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
        run: |
          set -o pipefail
          python scripts/fetch_tweets.py --user "${{ matrix.username }}" --blogger-id "${{ matrix.blogger_id }}" 2>&1 | tee "$RUNNER_TEMP/fetch-${{ matrix.blogger_id }}.log"
      - name: Extract new and overlap-day mentions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXTRACT_PROVIDER: ${{ inputs.extraction_provider || 'auto' }}
          EXTRACT_MODEL: ${{ inputs.extraction_model || '' }}
        run: |
          args=(--user "${{ matrix.blogger_id }}" --since "$(date -u -d '7 days ago' +%Y-%m-%d)")
          if [ -n "$EXTRACT_MODEL" ]; then args+=(--model "$EXTRACT_MODEL"); fi
          python scripts/extract.py "${args[@]}"
      - name: Record account watermarks
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from email.utils import parsedate_to_datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          account_id = "${{ matrix.blogger_id }}"
          username = "${{ matrix.username }}"
          path = Path("data/bloggers") / account_id / "raw_tweets.json"
          state_path = Path("data/bloggers") / account_id / "state.json"
          rows = json.loads(path.read_text()) if path.exists() else []
          state = json.loads(state_path.read_text()) if state_path.exists() else {}
          dates = []
          for row in rows:
              try: dates.append(parsedate_to_datetime(row.get("created_at") or row.get("createdAt")).astimezone(ZoneInfo("America/New_York")))
              except Exception: pass
          print(f"### @{username} (`{account_id}`)")
          print(f"- fetch outcome: ${{ steps.fetch.outcome }}")
          print(f"- raw records: {len(rows)}")
          print(f"- latest ET timestamp: {max(dates).isoformat() if dates else 'unavailable'}")
          print(f"- last successful fetch UTC: {state.get('last_successful_fetch_utc', 'unavailable')}")
          print(f"- API tweets returned: {state.get('last_api_tweets_seen', 'unavailable')}")
          print(f"- new tweets added: {state.get('last_new_tweets_added', 'unavailable')}")
          print(f"- pages fetched: {state.get('last_pages_fetched', 'unavailable')}")
          print(f"- stop reason: {state.get('last_fetch_stop_reason', 'unavailable')}")
          print(f"- exact anchor seen: {state.get('last_anchor_seen', 'unavailable')}")
          PY
          if [ "${{ steps.fetch.outcome }}" != "success" ]; then
            echo "- failure detail:" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 12 "$RUNNER_TEMP/fetch-${{ matrix.blogger_id }}.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload account snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-data-${{ matrix.blogger_id }}
          path: data/bloggers/${{ matrix.blogger_id }}/
          retention-days: 1

  publish:
    needs: [resolve-base, fetch-extract]
    if: ${{ always() && !cancelled() && needs.resolve-base.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BASE_SHA: ${{ needs.resolve-base.outputs.base_sha }}
    outputs:
      health_status: ${{ steps.health_outcome.outputs.status }}
      health_severity: ${{ steps.health_outcome.outputs.severity }}
      health_stage: ${{ steps.health_outcome.outputs.stage }}
      health_error_code: ${{ steps.health_outcome.outputs.error_code }}
      health_summary: ${{ steps.health_outcome.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ needs.resolve-base.outputs.base_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: "3.12"
      - name: Install dependencies
        id: install
        run: pip install -r requirements.txt
      - name: Fail closed on incomplete account refresh
        id: gate
        run: |
          {
            echo "## Trihourly production gate"
            echo "- fetch/extract matrix result: ${{ needs.fetch-extract.result }}"
            echo "- source revision: $BASE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || {
            echo "::error::Publish checkout does not match the locked main revision."
            exit 1
          }
          test "${{ needs.fetch-extract.result }}" = "success" || {
            echo "::error::One or more account refreshes failed; no database, dashboard, artifact, or commit was published."
            exit 1
          }
      - name: Download active account snapshots
        id: download
        uses: actions/download-artifact@v4
        with:
          pattern: blogger-data-*
          path: data/bloggers
          merge-multiple: false
      - name: Require the exact active artifact set
        id: artifacts
        run: |
          count=$(python scripts/roster.py --verify-artifacts data/bloggers)
          echo "- account artifacts: $count/$count" >> "$GITHUB_STEP_SUMMARY"
      - name: Flatten account snapshot directories
        id: flatten
        run: |
          cd data/bloggers
          for d in blogger-data-*; do
            id="${d#blogger-data-}"
            mkdir -p "$id"
            mv "$d"/* "$id"/
            rmdir "$d"
          done
      - name: Rebuild and resolve instrument identities
        id: database
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          python scripts/build_db.py
          python scripts/resolve_tickers_eodhd.py --apply
          python scripts/build_db.py
      - name: Validate rebuilt data
        id: data_validation
        run: python scripts/verify_data.py
      - name: Refresh prices
        id: prices
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python scripts/prices.py --history-weeks 52 --history-scope recent-28d
      - name: Refresh embedded avatars
        id: avatars
        run: python scripts/refresh_avatars.py --status-output "$RUNNER_TEMP/avatar-health.json"
      - name: Validate enriched data
        id: enrichment_validation
        run: python scripts/verify_data.py --require-price-history-52w
      - name: Choose latest ET data cutoff
        id: cutoff
        run: |
          REPORT_DATE=$(python - <<'PY'
          import json
          print(json.load(open("data/db/manifest.json", encoding="utf-8"))["date_range"][1])
          PY
          )
          echo "REPORT_DATE=$REPORT_DATE" >> "$GITHUB_ENV"
          echo "- report cutoff (ET): $REPORT_DATE" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json, os
          manifest = json.load(open("data/db/manifest.json", encoding="utf-8"))
          coverage = manifest.get("price_history_52w", {})
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"- 52-week statuses: `{json.dumps(coverage.get('status_counts', {}), sort_keys=True)}`\n")
              summary.write(f"- provider states: `{json.dumps(coverage.get('provider_state_counts', {}), sort_keys=True)}`\n")
              summary.write(f"- persistent price retry queue: {coverage.get('retry_queue', 0)}\n")
          PY
      - name: Run approved rules and pipeline tests
        id: tests
        run: |
          python handoff/10V-dashboard-backend-handoff-final-2026-07-17/03-rules-and-tests/test_report_rules.py
          python -m unittest tests.test_roster tests.test_fetch_tweets tests.test_dashboard_payload tests.test_build_db_dates tests.test_price_history tests.test_price_history_status tests.test_report_scope tests.test_refresh_avatars tests.test_write_sync_health
      - name: Build and validate v2 dashboard
        id: dashboard
        run: |
          python -m playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/dashboard"
          python skill/scripts/dashboard_payload.py "$REPORT_DATE" --output "$RUNNER_TEMP/dashboard/payload-$REPORT_DATE.json"
          python skill/scripts/render_dashboard.py --input "$RUNNER_TEMP/dashboard/payload-$REPORT_DATE.json" --output "$RUNNER_TEMP/dashboard/dashboard-$REPORT_DATE-$BASE_SHA.html"
          python skill/scripts/validate_dashboard.py "$RUNNER_TEMP/dashboard/dashboard-$REPORT_DATE-$BASE_SHA.html" --browser required | tee "$RUNNER_TEMP/dashboard/validation.json"
          sha256sum "$RUNNER_TEMP/dashboard/dashboard-$REPORT_DATE-$BASE_SHA.html" | tee "$RUNNER_TEMP/dashboard/SHA256SUMS.txt"
      - name: Write build metadata
        id: metadata
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          target = Path("data/builds/latest-dashboard.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps({
              "report_date_et": os.environ["REPORT_DATE"],
              "source_sha": os.environ["BASE_SHA"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "artifact_name": f"dashboard-{os.environ['BASE_SHA']}",
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Commit complete data snapshot
        id: publish_snapshot
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "- data snapshot: unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Trihourly snapshot $REPORT_DATE"
          # Generated snapshots are not safely mergeable. Refuse to publish if
          # main changed after this run locked its source revision.
          git fetch --no-tags origin main
          remote_sha=$(git rev-parse FETCH_HEAD)
          if [ "$remote_sha" != "$BASE_SHA" ]; then
            echo "PUBLISH_CONFLICT" > "$RUNNER_TEMP/publish-error-code"
            echo "::error::Main changed from $BASE_SHA to $remote_sha while this snapshot was building; no snapshot was pushed. Rerun from the new main revision."
            exit 1
          fi
          if ! git push origin HEAD:main; then
            echo "PUBLISH_FAILED" > "$RUNNER_TEMP/publish-error-code"
            exit 1
          fi
          echo "- published commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validated dashboard artifact
        id: dashboard_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ needs.resolve-base.outputs.base_sha }}
          path: ${{ runner.temp }}/dashboard/
          retention-days: 30
      - name: Publish artifact summary
        id: artifact_summary
        run: |
          {
            echo "## Published Dashboard"
            echo "- Artifact: dashboard-$BASE_SHA (retention: 30 days)"
            echo "- HTML: dashboard-$REPORT_DATE-$BASE_SHA.html"
            echo "- Payload, validation JSON, and SHA-256 are included in the artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect sync health outcome
        id: health_outcome
        if: always()
        env:
          FETCH_RESULT: ${{ needs.fetch-extract.result }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_OUTCOME: ${{ steps.setup_python.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          ARTIFACTS_OUTCOME: ${{ steps.artifacts.outcome }}
          FLATTEN_OUTCOME: ${{ steps.flatten.outcome }}
          DATABASE_OUTCOME: ${{ steps.database.outcome }}
          DATA_VALIDATION_OUTCOME: ${{ steps.data_validation.outcome }}
          PRICES_OUTCOME: ${{ steps.prices.outcome }}
          AVATARS_OUTCOME: ${{ steps.avatars.outcome }}
          ENRICHMENT_VALIDATION_OUTCOME: ${{ steps.enrichment_validation.outcome }}
          CUTOFF_OUTCOME: ${{ steps.cutoff.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          DASHBOARD_OUTCOME: ${{ steps.dashboard.outcome }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_snapshot.outcome }}
          DASHBOARD_ARTIFACT_OUTCOME: ${{ steps.dashboard_artifact.outcome }}
        run: >-
          python scripts/write_sync_health.py classify
          --avatar-status "$RUNNER_TEMP/avatar-health.json"
          --publish-error-code "$RUNNER_TEMP/publish-error-code"

  health-report:
    needs: [resolve-base, fetch-extract, publish]
    if: ${{ always() && needs.resolve-base.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record terminal sync health
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_STATUS: ${{ needs.publish.outputs.health_status }}
          HEALTH_SEVERITY: ${{ needs.publish.outputs.health_severity }}
          HEALTH_STAGE: ${{ needs.publish.outputs.health_stage }}
          HEALTH_ERROR_CODE: ${{ needs.publish.outputs.health_error_code }}
          HEALTH_SUMMARY: ${{ needs.publish.outputs.health_summary }}
          BASE_SHA: ${{ needs.resolve-base.outputs.base_sha }}
        shell: bash
        run: |
          status="${HEALTH_STATUS:-failed}"
          severity="${HEALTH_SEVERITY:-P1}"
          stage="${HEALTH_STAGE:-unknown}"
          if [ "$status" = "healthy" ]; then
            error_code=""
          else
            error_code="${HEALTH_ERROR_CODE:-UNKNOWN_PIPELINE_ERROR}"
          fi
          summary="${HEALTH_SUMMARY:-Pipeline ended without a health outcome}"
          args=(finish --status "$status" --severity "$severity" --stage "$stage" --summary "$summary" --source-sha "$BASE_SHA")
          if [ -n "$error_code" ]; then args+=(--error-code "$error_code"); fi
          if [ "$status" = "healthy" ] || [ "$status" = "degraded" ]; then
            args+=(--published-sha "$(git rev-parse HEAD)" --manifest data/db/manifest.json --avatar-cache data/avatar_cache.json)
          fi
          python scripts/write_sync_health.py "${args[@]}"
