name: trihourly-sync

on:
  # Cloudflare Cron is the sole automatic trigger. Keeping GitHub's own
  # `schedule` here would create two production writers for the same slot.
  repository_dispatch:
    types: [cloudflare_trihourly_sync]
  workflow_dispatch:
    inputs:
      extraction_provider:
        description: "auto, anthropic, or openai"
        required: false
        default: "auto"
        type: choice
        options: [auto, anthropic, openai]
      extraction_model:
        description: "Optional provider-specific model override"
        required: false
        default: ""
        type: string

concurrency:
  group: trihourly-pipeline-main
  cancel-in-progress: false

jobs:
  resolve-base:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      # A queued workflow keeps the SHA from when it was dispatched. Resolve
      # main only after this run owns the shared concurrency slot instead.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Record current main revision
        id: base
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "## Trihourly source" >> "$GITHUB_STEP_SUMMARY"
          echo "- locked main revision: $sha" >> "$GITHUB_STEP_SUMMARY"

  fetch-extract:
    needs: resolve-base
    name: fetch-extract (${{ matrix.blogger }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # twitterapi.io free-tier traffic is shared.  Keep all ten accounts
      # serial so a new run is reliable instead of concurrently rate-limited.
      max-parallel: 1
      matrix:
        blogger:
          - aleabitoreddit
          - zephyr_z9
          - jukan05
          - KawzInvests
          - michaelsikand
          - ren_stocks
          - octopusycc
          - unusual_whales
          - StockMKTNewz
          - DJTRadar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-base.outputs.base_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record trigger provenance
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          CF_SLOT_UTC: ${{ github.event.client_payload.slot_utc || 'manual' }}
          CF_DISPATCHED_AT: ${{ github.event.client_payload.dispatched_at_utc || 'manual' }}
        run: |
          {
            echo "## Trihourly trigger"
            echo "- event: $TRIGGER_EVENT"
            echo "- Cloudflare slot UTC: $CF_SLOT_UTC"
            echo "- Cloudflare dispatched at UTC: $CF_DISPATCHED_AT"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch incremental posts
        id: fetch
        shell: bash
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
        run: |
          set -o pipefail
          python scripts/fetch_tweets.py --user ${{ matrix.blogger }} 2>&1 | tee "$RUNNER_TEMP/fetch-${{ matrix.blogger }}.log"
      - name: Extract new and overlap-day mentions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXTRACT_PROVIDER: ${{ inputs.extraction_provider || 'auto' }}
          EXTRACT_MODEL: ${{ inputs.extraction_model || '' }}
        run: |
          args=(--user "${{ matrix.blogger }}" --since "$(date -u -d '7 days ago' +%Y-%m-%d)")
          if [ -n "$EXTRACT_MODEL" ]; then args+=(--model "$EXTRACT_MODEL"); fi
          python scripts/extract.py "${args[@]}"
      - name: Record account watermarks
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from datetime import datetime
          from email.utils import parsedate_to_datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          account = "${{ matrix.blogger }}"
          path = Path("data/bloggers") / account / "raw_tweets.json"
          state_path = Path("data/bloggers") / account / "state.json"
          rows = json.loads(path.read_text()) if path.exists() else []
          state = json.loads(state_path.read_text()) if state_path.exists() else {}
          dates = []
          for row in rows:
              try: dates.append(parsedate_to_datetime(row.get("created_at") or row.get("createdAt")).astimezone(ZoneInfo("America/New_York")))
              except Exception: pass
          print(f"### @{account}")
          print(f"- fetch outcome: ${{ steps.fetch.outcome }}")
          print(f"- raw records: {len(rows)}")
          print(f"- latest ET timestamp: {max(dates).isoformat() if dates else 'unavailable'}")
          print(f"- last successful fetch UTC: {state.get('last_successful_fetch_utc', 'unavailable')}")
          print(f"- API tweets returned: {state.get('last_api_tweets_seen', 'unavailable')}")
          print(f"- new tweets added: {state.get('last_new_tweets_added', 'unavailable')}")
          print(f"- pages fetched: {state.get('last_pages_fetched', 'unavailable')}")
          print(f"- stop reason: {state.get('last_fetch_stop_reason', 'unavailable')}")
          print(f"- exact anchor seen: {state.get('last_anchor_seen', 'unavailable')}")
          PY
          if [ "${{ steps.fetch.outcome }}" != "success" ]; then
            echo "- failure detail:" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 12 "$RUNNER_TEMP/fetch-${{ matrix.blogger }}.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload account snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-data-${{ matrix.blogger }}
          path: data/bloggers/${{ matrix.blogger }}/
          retention-days: 1

  publish:
    needs: [resolve-base, fetch-extract]
    if: ${{ always() && !cancelled() && needs.resolve-base.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BASE_SHA: ${{ needs.resolve-base.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-base.outputs.base_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fail closed on incomplete account refresh
        run: |
          {
            echo "## Trihourly production gate"
            echo "- fetch/extract matrix result: ${{ needs.fetch-extract.result }}"
            echo "- source revision: $BASE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || {
            echo "::error::Publish checkout does not match the locked main revision."
            exit 1
          }
          test "${{ needs.fetch-extract.result }}" = "success" || {
            echo "::error::One or more account refreshes failed; no database, dashboard, artifact, or commit was published."
            exit 1
          }
      - name: Download all ten account snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: blogger-data-*
          path: data/bloggers
          merge-multiple: false
      - name: Require exactly ten complete artifacts
        run: |
          expected="aleabitoreddit zephyr_z9 jukan05 KawzInvests michaelsikand ren_stocks octopusycc unusual_whales StockMKTNewz DJTRadar"
          missing=""
          for id in $expected; do
            test -d "data/bloggers/blogger-data-$id" || missing="$missing $id"
          done
          test -z "$missing" || { echo "::error::Missing account artifacts:$missing"; exit 1; }
          echo "- account artifacts: 10/10" >> "$GITHUB_STEP_SUMMARY"
      - name: Flatten account snapshot directories
        run: |
          cd data/bloggers
          for d in blogger-data-*; do
            id="${d#blogger-data-}"
            mkdir -p "$id"
            mv "$d"/* "$id"/
            rmdir "$d"
          done
      - name: Rebuild, resolve instrument identities, and validate data
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          python scripts/build_db.py
          python scripts/resolve_tickers_eodhd.py --apply
          python scripts/build_db.py
          python scripts/verify_data.py
      - name: Refresh prices and embedded avatars
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          python scripts/prices.py --history-weeks 52 --history-scope recent-28d
          python scripts/refresh_avatars.py
          python scripts/verify_data.py --require-price-history-52w
      - name: Choose latest ET data cutoff
        run: |
          REPORT_DATE=$(python - <<'PY'
          import json
          print(json.load(open("data/db/manifest.json", encoding="utf-8"))["date_range"][1])
          PY
          )
          echo "REPORT_DATE=$REPORT_DATE" >> "$GITHUB_ENV"
          echo "- report cutoff (ET): $REPORT_DATE" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json, os
          manifest = json.load(open("data/db/manifest.json", encoding="utf-8"))
          coverage = manifest.get("price_history_52w", {})
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"- 52-week statuses: `{json.dumps(coverage.get('status_counts', {}), sort_keys=True)}`\n")
              summary.write(f"- provider states: `{json.dumps(coverage.get('provider_state_counts', {}), sort_keys=True)}`\n")
              summary.write(f"- persistent price retry queue: {coverage.get('retry_queue', 0)}\n")
          PY
      - name: Run approved rules and new pipeline tests
        run: |
          python handoff/10V-dashboard-backend-handoff-final-2026-07-17/03-rules-and-tests/test_report_rules.py
          python -m unittest tests.test_dashboard_payload tests.test_build_db_dates tests.test_price_history tests.test_price_history_status tests.test_report_scope
      - name: Build and validate v2 dashboard
        run: |
          python -m playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/dashboard"
          python skill/scripts/dashboard_payload.py "$REPORT_DATE" --output "$RUNNER_TEMP/dashboard/payload-$REPORT_DATE.json"
          python skill/scripts/render_dashboard.py --input "$RUNNER_TEMP/dashboard/payload-$REPORT_DATE.json" --output "$RUNNER_TEMP/dashboard/dashboard-$REPORT_DATE-$BASE_SHA.html"
          python skill/scripts/validate_dashboard.py "$RUNNER_TEMP/dashboard/dashboard-$REPORT_DATE-$BASE_SHA.html" --browser required --expected-avatars 10 | tee "$RUNNER_TEMP/dashboard/validation.json"
          sha256sum "$RUNNER_TEMP/dashboard/dashboard-$REPORT_DATE-$BASE_SHA.html" | tee "$RUNNER_TEMP/dashboard/SHA256SUMS.txt"
      - name: Write build metadata
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          target = Path("data/builds/latest-dashboard.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps({
              "report_date_et": os.environ["REPORT_DATE"],
              "source_sha": os.environ["BASE_SHA"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "artifact_name": f"dashboard-{os.environ['BASE_SHA']}",
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Commit complete data snapshot
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "- data snapshot: unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Trihourly snapshot $REPORT_DATE"
          # Generated snapshots are not safely mergeable. Refuse to publish if
          # main changed after this run locked its source revision.
          git fetch --no-tags origin main
          remote_sha=$(git rev-parse FETCH_HEAD)
          if [ "$remote_sha" != "$BASE_SHA" ]; then
            echo "::error::Main changed from $BASE_SHA to $remote_sha while this snapshot was building; no snapshot was pushed. Rerun from the new main revision."
            exit 1
          fi
          git push origin HEAD:main
          echo "- published commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validated dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ needs.resolve-base.outputs.base_sha }}
          path: ${{ runner.temp }}/dashboard/
          retention-days: 30
      - name: Publish artifact summary
        run: |
          {
            echo "## Published Dashboard"
            echo "- Artifact: dashboard-$BASE_SHA (retention: 30 days)"
            echo "- HTML: dashboard-$REPORT_DATE-$BASE_SHA.html"
            echo "- Payload, validation JSON, and SHA-256 are included in the artifact."
          } >> "$GITHUB_STEP_SUMMARY"
