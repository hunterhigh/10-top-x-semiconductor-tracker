name: trihourly-sync

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      extraction_provider:
        description: "auto, anthropic, or openai"
        required: false
        default: "auto"
        type: choice
        options: [auto, anthropic, openai]
      extraction_model:
        description: "Optional provider-specific model override"
        required: false
        default: ""
        type: string

concurrency:
  group: trihourly-pipeline-main
  cancel-in-progress: false

jobs:
  fetch-extract:
    name: fetch-extract (${{ matrix.blogger }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # twitterapi.io free-tier traffic is shared.  Keep all ten accounts
      # serial so a new run is reliable instead of concurrently rate-limited.
      max-parallel: 1
      matrix:
        blogger:
          - aleabitoreddit
          - zephyr_z9
          - jukan05
          - KawzInvests
          - michaelsikand
          - ren_stocks
          - octopusycc
          - unusual_whales
          - StockMKTNewz
          - DJTRadar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch incremental posts
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
        run: python scripts/fetch_tweets.py --user ${{ matrix.blogger }}
      - name: Extract new and overlap-day mentions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXTRACT_PROVIDER: ${{ inputs.extraction_provider || 'auto' }}
          EXTRACT_MODEL: ${{ inputs.extraction_model || '' }}
        run: |
          args=(--user "${{ matrix.blogger }}" --since "$(date -u -d '7 days ago' +%Y-%m-%d)")
          if [ -n "$EXTRACT_MODEL" ]; then args+=(--model "$EXTRACT_MODEL"); fi
          python scripts/extract.py "${args[@]}"
      - name: Record account watermarks
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from datetime import datetime
          from email.utils import parsedate_to_datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          account = "${{ matrix.blogger }}"
          path = Path("data/bloggers") / account / "raw_tweets.json"
          rows = json.loads(path.read_text()) if path.exists() else []
          dates = []
          for row in rows:
              try: dates.append(parsedate_to_datetime(row.get("created_at") or row.get("createdAt")).astimezone(ZoneInfo("America/New_York")))
              except Exception: pass
          print(f"### @{account}")
          print(f"- raw records: {len(rows)}")
          print(f"- latest ET timestamp: {max(dates).isoformat() if dates else 'unavailable'}")
          PY
      - name: Upload account snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-data-${{ matrix.blogger }}
          path: data/bloggers/${{ matrix.blogger }}/
          retention-days: 1

  publish:
    needs: fetch-extract
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fail closed on incomplete account refresh
        run: |
          {
            echo "## Trihourly production gate"
            echo "- fetch/extract matrix result: ${{ needs.fetch-extract.result }}"
            echo "- source revision: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          test "${{ needs.fetch-extract.result }}" = "success" || {
            echo "::error::One or more account refreshes failed; no database, dashboard, artifact, or commit was published."
            exit 1
          }
      - name: Download all ten account snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: blogger-data-*
          path: data/bloggers
          merge-multiple: false
      - name: Require exactly ten complete artifacts
        run: |
          expected="aleabitoreddit zephyr_z9 jukan05 KawzInvests michaelsikand ren_stocks octopusycc unusual_whales StockMKTNewz DJTRadar"
          missing=""
          for id in $expected; do
            test -d "data/bloggers/blogger-data-$id" || missing="$missing $id"
          done
          test -z "$missing" || { echo "::error::Missing account artifacts:$missing"; exit 1; }
          echo "- account artifacts: 10/10" >> "$GITHUB_STEP_SUMMARY"
      - name: Flatten account snapshot directories
        run: |
          cd data/bloggers
          for d in blogger-data-*; do
            id="${d#blogger-data-}"
            mkdir -p "$id"
            mv "$d"/* "$id"/
            rmdir "$d"
          done
      - name: Rebuild factual database and validate data
        run: |
          python scripts/build_db.py
          python scripts/verify_data.py
      - name: Refresh prices and embedded avatars
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          python scripts/prices.py
          python scripts/refresh_avatars.py
      - name: Choose latest ET data cutoff
        run: |
          REPORT_DATE=$(python - <<'PY'
          import json
          print(json.load(open("data/db/manifest.json", encoding="utf-8"))["date_range"][1])
          PY
          )
          echo "REPORT_DATE=$REPORT_DATE" >> "$GITHUB_ENV"
          echo "- report cutoff (ET): $REPORT_DATE" >> "$GITHUB_STEP_SUMMARY"
      - name: Run approved rules and new pipeline tests
        run: |
          python handoff/10V-dashboard-backend-handoff-final-2026-07-17/03-rules-and-tests/test_report_rules.py
          python -m unittest tests.test_dashboard_payload tests.test_build_db_dates
      - name: Build and validate v2 dashboard
        run: |
          python -m playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/dashboard"
          python skill/scripts/dashboard_payload.py "$REPORT_DATE" --output "$RUNNER_TEMP/dashboard/payload-$REPORT_DATE.json"
          python skill/scripts/render_dashboard.py "$REPORT_DATE" --output "$RUNNER_TEMP/dashboard/dashboard-$REPORT_DATE-$GITHUB_SHA.html"
          python skill/scripts/validate_dashboard.py "$RUNNER_TEMP/dashboard/dashboard-$REPORT_DATE-$GITHUB_SHA.html" --browser required --expected-avatars 10 | tee "$RUNNER_TEMP/dashboard/validation.json"
          sha256sum "$RUNNER_TEMP/dashboard/dashboard-$REPORT_DATE-$GITHUB_SHA.html" | tee "$RUNNER_TEMP/dashboard/SHA256SUMS.txt"
      - name: Write build metadata
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          target = Path("data/builds/latest-dashboard.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps({
              "report_date_et": os.environ["REPORT_DATE"],
              "source_sha": os.environ["GITHUB_SHA"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "artifact_name": f"dashboard-{os.environ['GITHUB_SHA']}",
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Commit complete data snapshot
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "- data snapshot: unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Trihourly snapshot $REPORT_DATE"
          # The shared concurrency group prevents collisions between Actions
          # writers.  This handles an unrelated human/code commit that landed
          # while the dashboard was building; a real conflict fails closed.
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::Remote changed incompatibly while publishing; no snapshot was pushed. The next scheduled run will retry from main."
            exit 1
          fi
          git push origin HEAD:main
          echo "- published commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validated dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.sha }}
          path: ${{ runner.temp }}/dashboard/
          retention-days: 30
      - name: Publish artifact summary
        run: |
          {
            echo "## Published Dashboard"
            echo "- Artifact: dashboard-${{ github.sha }} (retention: 30 days)"
            echo "- HTML: dashboard-$REPORT_DATE-$GITHUB_SHA.html"
            echo "- Payload, validation JSON, and SHA-256 are included in the artifact."
          } >> "$GITHUB_STEP_SUMMARY"
