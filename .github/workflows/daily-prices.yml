name: daily-prices
on:
  schedule:
    # After the US close. UTC keeps this stable across daylight-saving changes.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      require_price_scope:
        description: "Fail if any in-scope ticker remains pending (use for first backfill)"
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-prices-main
  cancel-in-progress: false

jobs:
  prices:
    # Ticker-level, NOT per-blogger: data/db/stocks/*.json is shared across all
    # 10 tracked bloggers (see build_db.py), and prices.py fetches once per
    # ticker regardless of how many bloggers mention it. Do NOT matrix this by
    # blogger — that would burn the EODHD free-tier daily call budget 10x over
    # for symbols multiple trackers happen to cover in common.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update prices
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python scripts/prices.py
      - name: Verify data
        run: |
          if [ "${{ inputs.require_price_scope }}" = "true" ]; then
            python scripts/verify_data.py --require-price-scope
          else
            python scripts/verify_data.py
          fi
      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily prices $(date -u +%Y-%m-%d)"
          git push
