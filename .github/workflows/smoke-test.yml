name: smoke-test-v2

on:
  workflow_dispatch:
  push:
    paths:
      - "skill/scripts/dashboard_payload.py"
      - "skill/scripts/render_dashboard.py"
      - "skill/scripts/validate_dashboard.py"
      - "skill/scripts/snapshot_sync.py"
      - "skill/scripts/query_stock.py"
      - "skill/SKILL.md"
      - "skill/references/**"
      - "scripts/build_db.py"
      - "scripts/prices.py"
      - "scripts/refresh_avatars.py"
      - "tests/test_dashboard_payload.py"
      - "tests/test_build_db_dates.py"
      - "tests/test_dashboard_validator.py"
      - "tests/test_instrument_identity.py"
      - "handoff/10V-dashboard-backend-handoff-final-2026-07-17/**"
      - "requirements.txt"
      - ".github/workflows/smoke-test.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate v2 data model and approved aggregation rules
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python handoff/10V-dashboard-backend-handoff-final-2026-07-17/03-rules-and-tests/test_report_rules.py
      - name: Build and browser-validate v2 dashboard
        run: |
          REPORT_DATE=$(python - <<'PY'
          import json
          print(json.load(open("data/db/manifest.json", encoding="utf-8"))["date_range"][1])
          PY
          )
          python skill/scripts/dashboard_payload.py "$REPORT_DATE" --output "$RUNNER_TEMP/payload.json"
          python skill/scripts/render_dashboard.py "$REPORT_DATE" --output "$RUNNER_TEMP/dashboard.html"
          python skill/scripts/validate_dashboard.py "$RUNNER_TEMP/dashboard.html" --browser required --expected-avatars 10
