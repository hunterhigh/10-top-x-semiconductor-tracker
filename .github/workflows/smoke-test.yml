name: smoke-test

on:
  workflow_dispatch:   # manual trigger

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify config + per-blogger data present
        run: |
          echo "Tracked bloggers in config:" && python -c "import json; print(len(json.load(open('config/bloggers.json'))['bloggers']))"
          echo "Blogger data dirs:" && ls data/bloggers/ 2>/dev/null || echo "(none yet — run fetch_tweets.py/extract.py first)"
          echo "Shared stocks:" && ls data/db/stocks/*.json 2>/dev/null | wc -l || echo 0

      - name: Run build_db (pure aggregation across all bloggers, no API)
        run: python scripts/build_db.py

      - name: Run render EN, one blogger
        run: python skill/scripts/serenity_render.py --db data/db --config config/bloggers.json --blogger aleabitoreddit

      - name: Run render EN, consensus (all bloggers)
        run: python skill/scripts/serenity_render.py --db data/db --config config/bloggers.json --blogger all

      - name: Run render ZH
        run: python skill/scripts/serenity_render.py --db data/db --config config/bloggers.json --blogger all --lang zh

      - name: Check outputs
        run: |
          ls -lh *-tracker-*.html
          echo "✅ Smoke test passed"
