name: bihourly-sync
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      extraction_provider:
        description: "auto, anthropic, or openai"
        required: false
        default: "auto"
        type: choice
        options: [auto, anthropic, openai]
      extraction_model:
        description: "Optional provider-specific model override"
        required: false
        default: ""
        type: string

concurrency:
  group: bihourly-pipeline-main
  cancel-in-progress: false

jobs:
  fetch-extract:
    # One shard per tracked blogger, fully isolated (own state/raw/extracted
    # files under data/bloggers/{id}/) — a failure or rate-limit on one
    # account never blocks the other 9. Each shard uploads its output as an
    # artifact rather than pushing directly, so 10 concurrent jobs never race
    # on `git push`; the aggregate job below does the single combined commit.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # twitterapi.io free tier is QPS-limited to 1 request / 5s ACROSS the whole
      # account — running bloggers in parallel floods that shared limit and every
      # leg gets HTTP 429 on its very first request. Serialize instead; each
      # blogger's own requests are already paced (see fetch_tweets.py).
      max-parallel: 1
      matrix:
        blogger:
          - aleabitoreddit
          - zephyr_z9
          - jukan05
          - KawzInvests
          - michaelsikand
          - ren_stocks
          - octopusycc
          - unusual_whales
          - StockMKTNewz
          - DJTRadar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch new tweets
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
        run: python scripts/fetch_tweets.py --user ${{ matrix.blogger }}
      - name: Extract market mentions (selected LLM provider)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXTRACT_PROVIDER: ${{ inputs.extraction_provider || 'auto' }}
          EXTRACT_MODEL: ${{ inputs.extraction_model || '' }}
        run: |
          args=(--user "${{ matrix.blogger }}" --since "$(date -u -d '7 days ago' +%Y-%m-%d)")
          if [ -n "$EXTRACT_MODEL" ]; then args+=(--model "$EXTRACT_MODEL"); fi
          python scripts/extract.py "${args[@]}"
      - name: Upload blogger data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: blogger-data-${{ matrix.blogger }}
          path: data/bloggers/${{ matrix.blogger }}/
          retention-days: 1

  aggregate:
    needs: fetch-extract
    # Run even if one or more matrix legs failed (e.g. a bad handle) — the
    # bloggers that DID succeed already paid for LLM extraction, so their
    # artifacts must still get committed rather than silently discarded.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download all blogger artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: blogger-data-*
          path: data/bloggers
          merge-multiple: false
      - name: Summarize shard coverage
        run: |
          expected="aleabitoreddit zephyr_z9 jukan05 KawzInvests michaelsikand ren_stocks octopusycc unusual_whales StockMKTNewz DJTRadar"
          missing=""
          for id in $expected; do
            if [ ! -d "data/bloggers/blogger-data-$id" ]; then
              missing="$missing $id"
            fi
          done
          {
            echo "## Bi-hourly sync shard coverage"
            if [ -n "$missing" ]; then
              echo "⚠️ No artifact received for:$missing"
              echo "Existing committed data for these accounts was retained."
            else
              echo "✅ Artifacts received for all 10 tracked accounts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Flatten artifact directories
        # download-artifact with a pattern nests each artifact under its own
        # name (data/bloggers/blogger-data-<id>/...); move contents back to
        # data/bloggers/<id>/ to match what build_db.py expects.
        run: |
          cd data/bloggers
          for d in blogger-data-*; do
            id="${d#blogger-data-}"
            mkdir -p "$id"
            mv "$d"/* "$id"/ 2>/dev/null || true
            rmdir "$d"
          done
          ls -la
      - name: Rebuild shared stock database (all bloggers, no LLM)
        run: python scripts/build_db.py
      - name: Verify data
        run: python scripts/verify_data.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Bi-hourly sync $(date -u +%Y-%m-%dT%H:%M)"
          git push
