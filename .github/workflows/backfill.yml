name: backfill

on:
  workflow_dispatch:
    inputs:
      bloggers:
        description: "Comma-separated blogger ids to backfill"
        required: false
        default: "zephyr_z9,jukan05,KawzInvests,michaelsikand,ren_stocks,octopusycc,unusual_whales,StockMKTNewz,DJTRadar"
      since_days:
        description: "How many days of history to pull"
        required: false
        default: "30"

# Backfill writes the same facts as scheduled refresh.  It must not race it.
concurrency:
  group: trihourly-pipeline-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          IFS=',' read -ra IDS <<< "${{ inputs.bloggers }}"
          json=$(printf '"%s",' "${IDS[@]}" | sed 's/,$//')
          echo "matrix=[$json]" >> "$GITHUB_OUTPUT"

  fetch-extract:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The free-tier API is shared across accounts; serialize fetches.
      max-parallel: 1
      matrix:
        blogger: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch bounded history
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
        run: python scripts/fetch_tweets.py --user ${{ matrix.blogger }} --backfill --since-date $(date -u -d "${{ inputs.since_days }} days ago" +%Y-%m-%d)
      - name: Extract opinions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXTRACT_PROVIDER: auto
        run: python scripts/extract.py --user ${{ matrix.blogger }} --since $(date -u -d "${{ inputs.since_days }} days ago" +%Y-%m-%d)
      - name: Upload blogger snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-data-${{ matrix.blogger }}
          path: data/bloggers/${{ matrix.blogger }}/
          retention-days: 1

  aggregate:
    needs: fetch-extract
    # Partial refreshes are never allowed to publish a mixed snapshot.
    if: ${{ needs.fetch-extract.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download requested blogger artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: blogger-data-*
          path: data/bloggers
          merge-multiple: false
      - name: Require every requested artifact and flatten them
        run: |
          IFS=',' read -ra IDS <<< "${{ inputs.bloggers }}"
          missing=""
          for id in "${IDS[@]}"; do
            test -d "data/bloggers/blogger-data-$id" || missing="$missing $id"
          done
          test -z "$missing" || { echo "::error::Missing account artifacts:$missing"; exit 1; }
          cd data/bloggers
          for d in blogger-data-*; do
            id="${d#blogger-data-}"
            mkdir -p "$id"
            mv "$d"/* "$id"/
            rmdir "$d"
          done
          echo "- requested account artifacts: ${#IDS[@]}/${#IDS[@]}" >> "$GITHUB_STEP_SUMMARY"
      - name: Rebuild, price, and validate factual data
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          python scripts/build_db.py
          python scripts/resolve_tickers_eodhd.py --apply
          python scripts/build_db.py
          python scripts/verify_data.py
          python scripts/prices.py --history-weeks 52 --history-scope recent-28d
          python scripts/refresh_avatars.py
      - name: Choose latest ET data cutoff
        run: |
          REPORT_DATE=$(python - <<'PY'
          import json
          print(json.load(open("data/db/manifest.json", encoding="utf-8"))["date_range"][1])
          PY
          )
          echo "REPORT_DATE=$REPORT_DATE" >> "$GITHUB_ENV"
          echo "- report cutoff (ET): $REPORT_DATE" >> "$GITHUB_STEP_SUMMARY"
      - name: Run approved rules and pipeline tests
        run: |
          python handoff/10V-dashboard-backend-handoff-final-2026-07-17/03-rules-and-tests/test_report_rules.py
          python -m unittest tests.test_dashboard_payload tests.test_build_db_dates tests.test_price_history
      - name: Build and validate v2 dashboard
        run: |
          python -m playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/dashboard"
          python skill/scripts/dashboard_payload.py "$REPORT_DATE" --output "$RUNNER_TEMP/dashboard/payload-$REPORT_DATE.json"
          python skill/scripts/render_dashboard.py "$REPORT_DATE" --output "$RUNNER_TEMP/dashboard/dashboard-$REPORT_DATE-$GITHUB_SHA.html"
          python skill/scripts/validate_dashboard.py "$RUNNER_TEMP/dashboard/dashboard-$REPORT_DATE-$GITHUB_SHA.html" --browser required --expected-avatars 10 | tee "$RUNNER_TEMP/dashboard/validation.json"
          sha256sum "$RUNNER_TEMP/dashboard/dashboard-$REPORT_DATE-$GITHUB_SHA.html" | tee "$RUNNER_TEMP/dashboard/SHA256SUMS.txt"
      - name: Write build metadata
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          target = Path("data/builds/latest-dashboard.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps({
              "report_date_et": os.environ["REPORT_DATE"],
              "source_sha": os.environ["GITHUB_SHA"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "artifact_name": f"dashboard-{os.environ['GITHUB_SHA']}",
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Commit complete backfill snapshot
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "- data snapshot: unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Backfill (${{ inputs.since_days }}d): ${{ inputs.bloggers }}"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::Remote changed incompatibly while publishing; no backfill was pushed."
            exit 1
          fi
          git push origin HEAD:main
          echo "- published commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validated dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.sha }}
          path: ${{ runner.temp }}/dashboard/
          retention-days: 30
      - name: Publish artifact summary
        run: |
          {
            echo "## Published Backfill Dashboard"
            echo "- Artifact: dashboard-${{ github.sha }} (retention: 30 days)"
            echo "- HTML: dashboard-$REPORT_DATE-$GITHUB_SHA.html"
            echo "- Payload, validation JSON, and SHA-256 are included in the artifact."
          } >> "$GITHUB_STEP_SUMMARY"
